# Hosting for the web app. Still is plain static files in still/dist
# (no build step), so Netlify only needs to know which folder to publish.
[build]
  publish = "still/dist"
  command = ""

# Read aloud's natural voice (netlify/functions/speak.mjs, served at
# /api/speak). It needs OPENAI_API_KEY set in the site's environment
# variables, scoped to Functions; without it the app uses device voices.
[functions]
  directory = "netlify/functions"

# Always fetch the newest service worker so readers get updates promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
