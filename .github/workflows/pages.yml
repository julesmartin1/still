# Publishes the web app (still/dist, plain static files) to GitHub Pages on
# every push to main. The voice, visit counter and forms stay on Netlify;
# see SERVER_SITE in still/dist/natural-voice.js.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: still/dist
      - id: deploy
        uses: actions/deploy-pages@v4
